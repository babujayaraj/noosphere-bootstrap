apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: devops-tech-test
  labels:
    app: devops-tech-test-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-tech-test-api
  template:
    metadata:
      labels:
        app: devops-tech-test-api
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: api
          image: repo/my-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              name: http

          env:
            - name: NODE_ENV
              value: "production"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
