name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/test]

env:
  IMAGE_NAME: repo/my-api
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t repo/my-api:ci .

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build -t repo/my-api:ci .

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Grype scan (fail on High/Critical)
        run: |
          grype repo/my-api:ci --fail-on high

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      # Only configure AWS if AWS_ROLE_ARN exists
      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Only run plan if AWS credentials were configured
      - name: Terraform plan (dev)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        working-directory: terraform
        run: terraform plan -var-file=envs/dev.tfvars

      # If no AWS role ARN, explicitly skip with a clear log (so reviewers understand)
      - name: Skip Terraform plan (no AWS_ROLE_ARN configured)
        if: ${{ secrets.AWS_ROLE_ARN == '' }}
        run: |
          echo "Skipping terraform plan because AWS_ROLE_ARN secret is not configured."
          echo "This repo supports running terraform against LocalStack locally as per README."



  release:
    runs-on: ubuntu-latest
    # Do not depend on terraform because it may be skipped without AWS_ROLE_ARN
    needs: [build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release (tag + release)
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
