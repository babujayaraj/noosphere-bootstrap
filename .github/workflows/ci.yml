name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/test]

env:
  IMAGE_NAME: repo/my-api
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t repo/my-api:ci .

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build -t repo/my-api:ci .

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Grype scan (fail on High/Critical)
        run: |
          grype repo/my-api:ci --fail-on high

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC to AWS

    steps:
      - uses: actions/checkout@v4

      # --- OPTION A (Real AWS): OIDC role assumption ---
      # Create the IAM role separately (Terraform or manually), then paste role ARN below.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
          aws-region: ${{ env.AWS_REGION }}

      # --- Terraform checks ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan (dev)
        working-directory: terraform
        run: terraform plan -var-file=envs/dev.tfvars
