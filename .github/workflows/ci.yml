name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/test]

env:
  IMAGE_NAME: repo/my-api


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (local)
        run: |
          docker build -t repo/my-api:ci .

  security-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:scan .

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Grype scan (fail on High/Critical)
        run: |
          grype repo/my-api:ci --fail-on high